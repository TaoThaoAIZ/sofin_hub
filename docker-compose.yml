# Postgres local cho dev/test. Chạy: `npm run db:up` (ở gốc hoặc backend/).
# Cổng mặc định 5435 (tránh đụng các Postgres khác ở 5432-5434). Đổi cổng: đặt POSTGRES_PORT trong .env cạnh file này (và DATABASE_URL trong backend/.env cho khớp).
services:
  postgres:
    image: postgres:16-alpine
    container_name: sofinhub-postgres
    restart: unless-stopped
    # Chỉ cho dev/test: tắt fsync để TRUNCATE/CREATE SCHEMA nhanh (mất điện có thể hỏng DB, tạo lại bằng db:reset).
    command: ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    environment:
      POSTGRES_USER: sofinhub
      POSTGRES_PASSWORD: sofinhub
      POSTGRES_DB: sofinhub
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    volumes:
      - sofinhub_pgdata:/var/lib/postgresql/data
      # Chạy 1 lần khi volume còn trống: tạo thêm DB sofinhub_test cho test tích hợp.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sofinhub -d sofinhub']
      interval: 3s
      timeout: 3s
      retries: 20

  # Redis cho state chia sẻ giữa các instance (SSE pub/sub, vé, rate limit...). TUỲ CHỌN: bỏ trống REDIS_URL thì backend dùng in-memory.
  # Cổng 6380 (tránh đụng Redis 6379 trên máy). Dùng: `docker compose up -d redis`, rồi REDIS_URL=redis://localhost:6380 trong backend/.env.
  redis:
    image: redis:7-alpine
    container_name: sofinhub-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no'] # chỉ cache/pubsub tạm thời, không cần bền
    ports:
      - '${REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sofinhub_pgdata:
