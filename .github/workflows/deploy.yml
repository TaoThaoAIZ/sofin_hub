name: Deploy to AWS

# Tự build + deploy CẢ backend lẫn frontend lên EC2 (stack docker compose: postgres + backend + nginx/frontend) khi CI xanh trên master.
# Không mở cổng SSH: GitHub đăng nhập AWS bằng OIDC, đẩy gói source lên S3 rồi ra lệnh cho server qua AWS SSM.
# Server tự `docker compose up -d --build` (Docker cache lớp nên chỉ phần đổi mới build lại). Hạ tầng: xem deploy/aws/ và docs/AWS-Server.docx.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch: # chạy tay: tab Actions -> Deploy to AWS -> Run workflow (dùng để deploy lại bản master hiện tại)

# Không chạy 2 lần deploy song song (hàng đợi, không hủy deploy đang chạy dở).
concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write # cần cho OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ROLE_ARN: arn:aws:iam::989735870224:role/sofinhub-github-actions-role
  S3_BUCKET: sofinhub-uploads-989735870224
  INSTANCE_ID: i-05d5f57930626e99d
  SITE_URL: https://13-238-60-175.sslip.io

jobs:
  deploy:
    name: Build & deploy (BE + FE)
    # Chỉ deploy khi CI thành công (hoặc khi chạy tay).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Đúng commit mà CI đã kiểm (không phải master mới hơn nếu có push chen giữa).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Đóng gói source
        run: |
          tar czf "$RUNNER_TEMP/bundle.tgz" --exclude=node_modules --exclude=dist --exclude=coverage --exclude=data --exclude=.env backend frontend deploy/aws
          ls -lh "$RUNNER_TEMP/bundle.tgz"

      - name: Đẩy gói lên S3
        run: aws s3 cp "$RUNNER_TEMP/bundle.tgz" "s3://$S3_BUCKET/deploy/latest.tgz"

      - name: Ra lệnh deploy cho server (SSM)
        run: |
          cat > "$RUNNER_TEMP/ssm.json" <<EOF
          {"commands":[
            "set -e",
            "aws s3 cp s3://$S3_BUCKET/deploy/latest.tgz /tmp/sofinhub-bundle.tgz --region $AWS_REGION",
            "rm -rf /tmp/sofinhub-x && mkdir -p /tmp/sofinhub-x",
            "tar xzf /tmp/sofinhub-bundle.tgz -C /tmp/sofinhub-x deploy/aws/remote-deploy.sh",
            "bash /tmp/sofinhub-x/deploy/aws/remote-deploy.sh /tmp/sofinhub-bundle.tgz"
          ]}
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 1800 \
            --parameters "file://$RUNNER_TEMP/ssm.json" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          STATUS=InProgress
          for _ in $(seq 1 180); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          echo "Trạng thái: $STATUS"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text | tail -n 60
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text | tail -n 30
          [ "$STATUS" = "Success" ]

      - name: Kiểm tra site sau deploy
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 15 "$SITE_URL/health" && exit 0
            sleep 10
          done
          echo "Site không phản hồi sau deploy" && exit 1
