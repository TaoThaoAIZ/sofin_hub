server {
  listen 80 default_server;
  server_name _;

  # File upload tối đa 25MB (UPLOAD_MAX_FILE_MB) + dư cho multipart/overhead.
  client_max_body_size 30m;

  root /usr/share/nginx/html;
  index index.html;

  # Backend Express: API, SSE (tin nhắn/thông báo realtime), upload PUT, tải file.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    # SSE cần tắt buffer và timeout dài (backend gửi heartbeat mỗi 25s).
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /health {
    proxy_pass http://backend:4000/health;
    access_log off;
  }

  # Asset có hash trong tên file: cache dài.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router: mọi đường dẫn khác trả index.html (không cache để lấy bản build mới).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
