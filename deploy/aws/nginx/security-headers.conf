# Header bảo mật cho phần giao diện (trang tĩnh). `add_header` trong một location sẽ GHI ĐÈ header kế thừa từ server,
# nên file này được include trong từng location có add_header riêng. (HSTS chỉ có tác dụng khi trang chạy qua HTTPS.)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
